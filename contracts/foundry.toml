[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "forge-std/=lib/forge-std/src/",
]

[fmt]
line_length = 110

# Base Sepolia is the primary chain (chainId 84532). See ARCHITECTURE.md §0.1.
[rpc_endpoints]
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
